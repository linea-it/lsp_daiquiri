name: Docker Build (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para git describe enxergar tags

      - name: Define image tag
        id: vars
        run: |
          TAG=$(git describe --always)
          echo "image=linea/lsp_daiquiri:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/local/daiquiri/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}

      - name: Summary
        run: |
          {
            echo "## Docker image pushed :whale:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${{ steps.vars.outputs.image }}\` |"
            echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |"
            echo "| **Ref** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo '```bash'
            echo "docker pull ${{ steps.vars.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
