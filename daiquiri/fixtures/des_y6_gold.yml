  tables:
  - name: des_y6_gold
    title: DES Y6 GOLD
    description: 'Final DES Y6 Gold catalog of galaxies and stars over the 5000 sq-deg Southern footprint, from six years of
    grizY imaging in Data Release 2. Contains 669 million objects to i = 23.4 (S/N = 10) with improved depth, star/galaxy
    classification, and photometry over Y3 Gold; also includes survey property maps for Y6 cosmology analyses.'
    long_description: 'The Dark Energy Survey is releasing the final catalog of precise measurements of galaxies and stars within
    the DES 5000-square-degree footprint in the South Galactic Cap. The Y6 Gold catalog is derived from Data Release 2 and
    includes all six years of g,r,i,z,Y imaging measurements. Y6 Gold was formulated for the DES final cosmological analyses,
    but it has very general applicability. Compared to the previous Y3 Gold catalog, the depth, star/galaxy classification,
    photometric precision, and photometric uniformity are all substantially improved. Y6 Gold contains 669 million objects
    to i-band of 23.4 (S/N = 10 for extended objects).

    The Y6 Gold data products and data quality checks are described in (Bechtol et al. 2025) . Updated information will be
    published here, when applicable. In addition to the Y6 Gold catalog, DES has derived a set of survey properties maps that
    accompany these Y6 Cosmology analyses which are also available below.'
