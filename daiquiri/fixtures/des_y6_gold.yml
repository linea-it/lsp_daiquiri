- name: des_y6_gold
  title: DES Y6 GOLD
  description: >
    DES Y6 Gold data products for the Dark Energy Survey final cosmology program: the Y6 Gold object catalog (669 million galaxies and stars over 5000 sq deg), the WaZP galaxy cluster catalog (400,000+ clusters to z ~ 1.3), and associated cluster member galaxies with membership probabilities and photometry.
  long_description: >
    This schema groups the principal DES Year 6 (Y6) Gold data products released for the survey's final cosmological analyses over the 5000 square-degree Southern footprint in the South Galactic Cap.

    The des_y6_gold table holds the final Y6 Gold catalog of galaxies and stars, derived from six years of grizY imaging in DES Data Release 2. It contains 669 million objects to i = 23.4 (S/N = 10) with improved depth, star/galaxy classification, photometric precision, and uniformity relative to the Y3 Gold release. Survey property maps for Y6 cosmology analyses are described alongside this catalog (Bechtol et al. 2025).

    The y6_cluster_wazp table lists galaxy clusters detected by the WaZP cluster finder on the full DES-Y6 dataset—over 400,000 systems with richness Ngals > 5, reaching redshifts up to z = 1.3, including a homogenized cosmology subsample of 33,000 rich clusters (Ngals > 25). Cluster properties include photometric and spectroscopic redshifts, richness, radii, footprint coverage, central-galaxy identification, and cross-matches to Sunyaev–Zel'dovich Effect detections from SPT and ACT (Benoist et al. 2025).

    The y6_cluster_members_wazp table provides candidate member galaxies linked to each WaZP cluster, with membership probability Pmem, redshifts, central-galaxy flags, and grizY magnitudes used to define cluster richness in the parent catalog.
