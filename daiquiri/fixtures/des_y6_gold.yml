  - name: y6_cluster_wazp
    title: Y6 CLUSTER WAZP
    description: 'Galaxy cluster catalog detected by the WaZP cluster finder on the full six years of DES-Y6 observations.
      The finder does not rely on red-sequence identification. The catalog contains over 400,000 clusters with richness
      Ngals > 5, reaching redshifts up to z = 1.3. A cosmology subsample of 33,000 rich clusters (Ngals > 25) has homogenized
      observation depth and richness. Cluster properties include photometric and spectroscopic redshifts, richness, radii,
      footprint coverage, central-galaxy identification, and cross-matches to Sunyaev–Zel''dovich Effect (SZE) detections
      from SPT and ACT.

      '
    long_description: 'In Benoist et al. (2025), we present and characterize the galaxy cluster catalog detected by the WaZP
      cluster finder on the full six years of DES-Y6 observations. WaZP is not based on red-sequence identification. The
      full catalog contains over 400,000 detected clusters with richnesses Ngals above 5 and reaching redshifts up to z =
      1.3. We also provide a cosmology version in which observation depth and richness are homogenized, containing 33,000
      rich clusters (Ngals > 25), flagged by in_cosmo. Compared with the DES-Y1 WaZP catalog, essentially all clusters within
      the common footprint and depth limit are recovered. Deeper DES-Y6 observations and a more complete spectroscopic redshift
      sample improve cluster redshifts, with average scatter of 1.4% and offset of 0.2%. Optical clusters are cross-matched
      with SZE samples from the South Pole Telescope (SPT) and the Atacama Cosmology Telescope (ACT): essentially all SZE clusters
      with reasonable overlapping footprint have a WaZP counterpart; conversely, 90% of optical detections with Ngals > 150
      have a counterpart in the deeper SZE survey regions. About 15–20% of SZE-matched systems have more than one possible
      WaZP counterpart at the same redshift within the SZE R500c, suggesting interacting or unrelaxed systems. WaZP and SZE
      centerings are consistent given the optical and SZE beams.

      '
    attribution: Benoist et al. (2025). WaZP galaxy cluster catalog on DES-Y6.
    order: 4
