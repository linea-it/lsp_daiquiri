  - name: y6_cluster_members_wazp
    title: Y6 CLUSTER MEMBERS WAZP
    description: 'Galaxy members associated with WaZP DES-Y6 clusters. Each row is a candidate member galaxy linked to a cluster
      by id_cluster, with membership probability Pmem, photometric and spectroscopic redshifts, central-galaxy flag, and grizY
      magnitudes. Members are used to define cluster richness Ngals in the parent catalog.

      '
    long_description: 'This table lists galaxies assigned as members of WaZP clusters detected on DES-Y6 (Benoist et al. 2025).
      Each entry is linked to a cluster in y6_cluster_wazp via id_cluster. Membership probability Pmem is the weight used to
      compute cluster richness Ngals (sum of Pmem down to m*+1.5 within the cluster radius). The table includes positions,
      photometric redshifts, spectroscopic redshifts and sources when available, a flag for the central galaxy, and grizY
      magnitudes. Improved DES-Y6 depth and spectroscopic coverage support more accurate cluster redshifts and member assignments
      than the DES-Y1 WaZP release.

      '
