    columns:
    - name: dia_source_id
      ucd: meta.id;obs.image
      unit: ''
      description: Unique identifier of this DiaSource.
      order: 1
    - name: visit
      ucd: meta.id;obs.image
      unit: ''
      description: Id of the visit where this diaSource was measured.
      order: 2
    - name: detector
      ucd: meta.id;obs.image
      unit: ''
      description: Id of the detector where this diaSource was measured.
      order: 3
    - name: dia_object_id
      ucd: meta.id;src
      unit: ''
      description: Id of the diaObject this source was associated with, if any. If not,
        it is set to 0
      order: 4
    - name: ss_object_id
      ucd: meta.id;src
      unit: ''
      description: Id of the ssObject this source was associated with, if any. If not,
        it is set to 0
      order: 5
    - name: parent_dia_source_id
      ucd: meta.id;src
      unit: ''
      description: Id of the parent diaSource this diaSource has been deblended from,
        if any.
      order: 6
    - name: midpoint_mjd_tai
      ucd: time.epoch
      unit: d
      description: Effective mid-visit time for this diaSource, expressed as Modified
        Julian Date, International Atomic Time.
      order: 7
    - name: ra
      ucd: pos.eq.ra;meta.main
      unit: deg
      description: Right ascension coordinate of the center of this diaSource.
      order: 8
    - name: dec
      ucd: pos.eq.dec;meta.main
      unit: deg
      description: Declination coordinate of the center of this diaSource.
      order: 9
    - name: ra_err
      ucd: stat.error;pos.eq.ra
      unit: deg
      description: Angular error in right ascension (∂RA*cos(Dec)).
      order: 10
    - name: dec_err
      ucd: stat.error;pos.eq.dec
      unit: deg
      description: Error in declination.
      order: 11
    - name: ra_dec_cov
      ucd: stat.covariance;pos.eq.ra;pos.eq.dec
      unit: deg**2
      description: Covariance between right ascension (RA*cos(Dec)) and declination.
      order: 12
    - name: x
      ucd: pos.cartesian.x
      unit: pixel
      description: Unweighted first moment centroid, overall centroid.
      order: 13
    - name: x_err
      ucd: stat.error;pos.cartesian.x
      unit: pixel
      description: 1-sigma uncertainty on x position.
      order: 14
    - name: y
      ucd: pos.cartesian.y
      unit: pixel
      description: Unweighted first moment centroid, overall centroid.
      order: 15
    - name: y_err
      ucd: stat.error;pos.cartesian.y
      unit: pixel
      description: 1-sigma uncertainty on y position.
      order: 16
    - name: centroid_flag
      ucd: ''
      unit: ''
      description: General centroid algorithm failure flag; set if anything went wrong
        when fitting the centroid. Another centroid flag field should also be set to provide
        more information.
      order: 17
    - name: ap_flux
      ucd: phot.flux
      unit: nJy
      description: Flux in a 12 pixel radius aperture on the difference image.
      order: 18
    - name: ap_flux_err
      ucd: stat.error;phot.flux
      unit: nJy
      description: Estimated uncertainty of apFlux.
      order: 19
    - name: ap_flux_flag
      ucd: ''
      unit: ''
      description: General aperture flux algorithm failure flag; set if anything went
        wrong when measuring aperture fluxes. Another apFlux flag field should also be
        set to provide more information.
      order: 20
    - name: ap_flux_flag_aperture_truncated
      ucd: ''
      unit: ''
      description: Aperture did not fit within measurement image.
      order: 21
    - name: is_negative
      ucd: ''
      unit: ''
      description: Source was detected as significantly negative.
      order: 22
    - name: snr
      ucd: stat.snr
      unit: ''
      description: The signal-to-noise ratio at which this source was detected in the
        difference image.
      order: 23
    - name: psf_flux
      ucd: phot.flux
      unit: nJy
      description: Flux for Point Source model. Note this actually measures the flux difference
        between the template and the visit image.
      order: 24
    - name: psf_flux_err
      ucd: stat.error;phot.flux
      unit: nJy
      description: Uncertainty of psfFlux.
      order: 25
    - name: psf_chi2
      ucd: stat.fit.chi2
      unit: ''
      description: Chi^2 statistic of the point source model fit.
      order: 26
    - name: psf_ndata
      ucd: ''
      unit: pixel
      description: The number of data points (pixels) used to fit the point source model.
      order: 27
    - name: psf_flux_flag
      ucd: ''
      unit: ''
      description: Failure to derive linear least-squares fit of psf model. Another psfFlux
        flag field should also be set to provide more information.
      order: 28
    - name: psf_flux_flag_edge
      ucd: ''
      unit: ''
      description: Object was too close to the edge of the image to use the full PSF model.
      order: 29
    - name: psf_flux_flag_no_good_pixels
      ucd: ''
      unit: ''
      description: Not enough non-rejected pixels in data to attempt the fit.
      order: 30
    - name: trail_flux
      ucd: ''
      unit: nJy
      description: Flux for a trailed source model. Note this actually measures the flux
        difference between the template and the visit image.
      order: 31
    - name: trail_flux_err
      ucd: ''
      unit: nJy
      description: Uncertainty of trailFlux.
      order: 32
    - name: trail_ra
      ucd: pos.eq.ra
      unit: deg
      description: Right ascension coordinate of centroid for trailed source model.
      order: 33
    - name: trail_dec
      ucd: pos.eq.dec
      unit: deg
      description: Declination coordinate of centroid for trailed source model.
      order: 34
    - name: trail_length
      ucd: ''
      unit: arcsec
      description: Maximum likelihood fit of trail length.
      order: 35
    - name: trail_angle
      ucd: ''
      unit: deg
      description: Maximum likelihood fit of the angle between the meridian through the
        centroid and the trail direction (bearing).
      order: 36
    - name: trail_flag_edge
      ucd: ''
      unit: ''
      description: This flag is set if a trailed source extends onto or past edge pixels.
      order: 37
    - name: dipole_mean_flux
      ucd: ''
      unit: nJy
      description: Maximum likelihood value for the mean absolute flux of the two lobes
        for a dipole model.
      order: 38
    - name: dipole_mean_flux_err
      ucd: stat.error
      unit: nJy
      description: Uncertainty of dipoleMeanFlux.
      order: 39
    - name: dipole_flux_diff
      ucd: ''
      unit: nJy
      description: Maximum likelihood value for the difference of absolute fluxes of the
        two lobes for a dipole model.
      order: 40
    - name: dipole_flux_diff_err
      ucd: stat.error
      unit: nJy
      description: Uncertainty of dipoleFluxDiff.
      order: 41
    - name: dipole_length
      ucd: pos.angDistance
      unit: arcsec
      description: Maximum likelihood value for the lobe separation in dipole model.
      order: 42
    - name: dipole_angle
      ucd: pos.posAng
      unit: deg
      description: Maximum likelihood fit of the angle between the meridian through the
        centroid and the dipole direction (bearing, from negative to positive lobe).
      order: 43
    - name: dipole_chi2
      ucd: stat.fit.chi2
      unit: ''
      description: Chi^2 statistic of the model fit.
      order: 44
    - name: dipole_ndata
      ucd: ''
      unit: ''
      description: The number of data points (pixels) used to fit the model.
      order: 45
    - name: science_flux
      ucd: phot.flux
      unit: nJy
      description: Forced photometry flux for a point source model measured on the visit
        image centered at DiaSource position.
      order: 46
