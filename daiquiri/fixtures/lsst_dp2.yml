  - name: object
    title: LSST DP2 OBJECT
    description: >
        <p>(adapted from <a href="https://lse-163.lsst.io/" target="_blank" rel="noopener">Rubin Observatory Data Products Definitions Document – DPDD</a>)</p>

        <i>"The DP2 Object table contains measurements derived from deep coadded images, including positions, fluxes, shapes, and quality flags for detected astrophysical sources. It provides higher signal-to-noise estimates compared to single-epoch detections and includes essential attributes for scientific analysis."</i>

        For more information, click on the table name.
    long_description: >
      <p>(adapted from Rubin Observatory Data Products Definitions Document – DPDD)</p>

      <i>"The Object catalog in DP2 consists of measurements obtained from multi-epoch coadded images. It includes centroiding information, PSF- and aperture-based photometry, model-fit fluxes, shape measurements, deblending outputs, and associated uncertainties. The table also provides quality flags, detection significance, and metadata enabling cross-matching and scientific classification."</i>

      <h3>Reference</h3>

      <p>Find details about Rubin Observatory and DP2 data products on:</p>
      <ul>
        <li><a href="https://www.lsst.org" target="_blank" rel="noopener">Rubin Observatory website</a></li>
        <li><a href="https://pipelines.lsst.io" target="_blank" rel="noopener">LSST Science Pipelines documentation</a></li>
        <li><a href="https://dp2.lsst.io/" target="_blank" rel="noopener">Rubin DP2 documentation</a></li>
        <li><a href="https://rubinobservatory.org/for-scientists" target="_blank" rel="noopener">Rubin science resources</a></li>
        <li><a href="https://lse-163.lsst.io/" target="_blank" rel="noopener">Rubin Observatory Data Products Definitions Document – DPDD</a></li>
      </ul>
    attribution: >
      <blockquote>
        <p>LSST Data Preview 2 (DP2) data products are provided by the Vera C. Rubin Observatory and supported by the U.S. National Science Foundation and the U.S. Department of Energy Office of Science. Construction and operations of the Rubin Observatory are carried out by the NSF-funded Association of Universities for Research in Astronomy (AURA) and the DOE-funded SLAC National Accelerator Laboratory.</p>
        <p>The Rubin Observatory LSST Project is a partnership among numerous institutions worldwide, including LIneA, the host institution for the Brazilian IDAC. Additional support for scientific analysis and data access tools has been provided by the LSST Corporation and international Rubin Science Collaborations.</p>
        <p>Software, pipelines, and infrastructure used to generate DP2 data products were developed by the Rubin Observatory Data Management team and collaborating institutions with in-kind contribution agreements.</p>
      </blockquote>
