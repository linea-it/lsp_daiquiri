- name: lsst_dp2
  title: LSST DP2
  description: >
    The LSST Data Preview 2 (DP2) is an early internal release of Rubin Observatory data products, providing users with a first contact with images and catalogs generated by the LSST Science Pipelines using real data obtained by the LSST Commissioning Camera. DP2 includes processed single-epoch images, coadds, and derived object catalogs from a subset of the LSST Science Validation data.
  long_description: >
    <p>(adapted from information on the <a href="https://dp2.lsst.io/" target="_blank" rel="noopener">DP2 Documentation website published by the Rubin Observatory</a>)</p>
    <i>"Data Preview 2 provides the community with access to prototype LSST data products processed with early versions of the Science Pipelines. DP2 includes single-visit images, coadded images, and catalog data products extracted from these images. These data allow users to become familiar with Rubin data formats, experiment with early tools, and prepare for upcoming data releases."</i>
  attribution: >
    <blockquote>
    <p>LSST Data Preview 2 (DP2) data products are provided by the Vera C. Rubin Observatory and supported by the U.S. National Science Foundation and the U.S. Department of Energy Office of Science. Construction and operations of the Rubin Observatory are carried out by the NSF-funded Association of Universities for Research in Astronomy (AURA) and the DOE-funded SLAC National Accelerator Laboratory.</p>

    <p>The Rubin Observatory LSST Project is a partnership among numerous institutions worldwide, including LIneA, the host institution for the Brazilian IDAC. Additional support for scientific analysis and data access tools has been provided by the LSST Corporation and international Rubin Science Collaborations.</p>

        <p>Software, pipelines, and infrastructure used to generate DP2 data products were developed by the Rubin Observatory Data Management team and collaborating institutions with in-kind contribution agreements.</p>
    </blockquote>
