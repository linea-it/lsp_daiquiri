      ucd: pos.galactic.lat
      unit: deg
      description: Galactic latitude, converted from the observed coordinates.
      order: 7
    - name: elongation
      ucd: pos.phaseAng
      unit: deg
      description: Solar elongation of the object at the time of observation.
      order: 8
    - name: phase_angle
      ucd: pos.phaseAng
      unit: deg
      description: Phase angle between the Sun, object, and observer.
      order: 9
    - name: topo_range
      ucd: pos.distance
      unit: AU
      description: Topocentric distance (delta) at light-emission time.
      order: 10
    - name: topo_range_rate
      ucd: phys.veloc
      unit: km/s
      description: Topocentric radial (line-of-sight) velocity (deldot); positive values
        indicate motion away from the observer.
      order: 11
    - name: helio_range
      ucd: pos.distance;pos.heliocentric
      unit: AU
      description: Heliocentric distance (r) at light-emission time.
      order: 12
    - name: helio_range_rate
      ucd: phys.veloc;pos.heliocentric
      unit: km/s
      description: Heliocentric radial velocity (rdot); positive values indicate motion
        away from the Sun.
      order: 13
    - name: eph_ra
      ucd: pos.eq.ra;meta.modelled;pos.ephem
      unit: deg
      description: Predicted ICRS right ascension from the orbit in mpc_orbits.
      order: 14
    - name: eph_dec
      ucd: pos.eq.dec;meta.modelled;pos.ephem
      unit: deg
      description: Predicted ICRS declination from the orbit in mpc_orbits.
      order: 15
    - name: eph_vmag
      ucd: phot.mag;em.opt.V
      unit: mag
      description: Predicted magnitude in V band, computed from mpc_orbits data including
        the mpc_orbits-provided (H, G) estimates
      order: 16
    - name: eph_rate
      ucd: pos.pm;pos.ephem
      unit: deg/d
      description: Total predicted on-sky angular rate of motion.
      order: 17
    - name: eph_rate_ra
      ucd: pos.pm;pos.eq.ra;pos.ephem
      unit: deg/d
      description: Predicted on-sky angular rate in the R.A. direction (includes the cos(dec)
        factor).
      order: 18
    - name: eph_rate_dec
      ucd: pos.pm;pos.eq.dec;pos.ephem
      unit: deg/d
      description: Predicted on-sky angular rate in the declination direction.
      order: 19
    - name: eph_offset
      ucd: pos.angDistance;stat.fit.omc
      unit: arcsec
      description: Total observed versus predicted angular separation on the sky.
      order: 20
    - name: eph_offset_ra
      ucd: pos.eq.ra;stat.fit.omc
      unit: arcsec
      description: Offset between observed and predicted position in the R.A. direction
        (includes cos(dec) term).
      order: 21
    - name: eph_offset_dec
      ucd: pos.eq.dec;stat.fit.omc
      unit: arcsec
      description: Offset between observed and predicted position in declination.
      order: 22
    - name: eph_offset_along_track
      ucd: pos.angDistance;stat.fit.omc
      unit: arcsec
      description: Offset between observed and predicted position in the along-track direction
        on the sky.
      order: 23
    - name: eph_offset_cross_track
      ucd: pos.angDistance;stat.fit.omc
      unit: arcsec
      description: Offset between observed and predicted position in the cross-track direction
        on the sky.
      order: 24
    - name: helio_x
      ucd: pos.cartesian.x;pos.heliocentric
      unit: AU
      description: Cartesian heliocentric X coordinate at light-emission time (ICRS).
      order: 25
    - name: helio_y
      ucd: pos.cartesian.y;pos.heliocentric
      unit: AU
      description: Cartesian heliocentric Y coordinate at light-emission time (ICRS).
      order: 26
    - name: helio_z
      ucd: pos.cartesian.z;pos.heliocentric
      unit: AU
      description: Cartesian heliocentric Z coordinate at light-emission time (ICRS).
      order: 27
    - name: helio_vx
      ucd: phys.veloc;pos.cartesian.x
      unit: km/s
      description: Cartesian heliocentric X velocity at light-emission time (ICRS).
      order: 28
    - name: helio_vy
      ucd: phys.veloc;pos.cartesian.y
      unit: km/s
      description: Cartesian heliocentric Y velocity at light-emission time (ICRS).
      order: 29
    - name: helio_vz
      ucd: phys.veloc;pos.cartesian.z
      unit: km/s
      description: Cartesian heliocentric Z velocity at light-emission time (ICRS).
      order: 30
    - name: helio_vtot
      ucd: phys.veloc;pos.heliocentric
      unit: km/s
      description: The magnitude of the heliocentric velocity vector, sqrt(vx*vx + vy*vy
        + vz*vz).
      order: 31
    - name: topo_x
      ucd: pos.cartesian.x
      unit: AU
      description: Cartesian topocentric X coordinate at light-emission time (ICRS).
      order: 32
    - name: topo_y
      ucd: pos.cartesian.y
      unit: AU
      description: Cartesian topocentric Y coordinate at light-emission time (ICRS).
      order: 33
    - name: topo_z
      ucd: pos.cartesian.z
      unit: AU
      description: Cartesian topocentric Z coordinate at light-emission time (ICRS).
      order: 34
    - name: topo_vx
      ucd: phys.veloc;pos.cartesian.x
      unit: km/s
      description: Cartesian topocentric X velocity at light-emission time (ICRS).
      order: 35
    - name: topo_vy
      ucd: phys.veloc;pos.cartesian.y
      unit: km/s
      description: Cartesian topocentric Y velocity at light-emission time (ICRS).
      order: 36
    - name: topo_vz
      ucd: phys.veloc;pos.cartesian.z
      unit: km/s
      description: Cartesian topocentric Z velocity at light-emission time (ICRS).
      order: 37
    - name: topo_vtot
      ucd: phys.veloc
      unit: km/s
      description: The magnitude of the topocentric velocity vector, sqrt(vx*vx + vy*vy
        + vz*vz).
      order: 38
    - name: dia_distance_rank
      ucd: ''
      unit: ''
      description: The rank of the diaSourceId-identified source in terms of its closeness
        to the predicted SSO position. If diaSourceId is the nearest DiaSource to this
        SSO prediction, diaSourceDistanceRank=1 would be set. If it is the second nearest,
        it would be 2, etc.
      order: 39
  - name: visit_detector_table
    title: LSST DP2 VISITDETECTOR
    description: >
        <p>(adapted from <a href="https://sdm-schemas.lsst.io/dp2.html#VisitDetector" target="_blank" rel="noopener">Rubin Observatory DP2 Schema – VisitDetector</a>)</p>

        <i>"Per-detector metadata and metrics associated with each visit."</i>

        For more information, click on the table name.
    long_description: >
      <p>(adapted from <a href="https://sdm-schemas.lsst.io/dp2.html#VisitDetector" target="_blank" rel="noopener">Rubin Observatory DP2 Schema – VisitDetector</a>)</p>

      <i>"Per-detector metadata and metrics associated with each visit."</i>

      <h3>Reference</h3>

      <p>Find details about Rubin Observatory and DP2 data products on:</p>
