    - name: gauss_psf_reconvolved_g2
      ucd: ''
      unit: ''
      description: Reduced-shear g2 of the reconvolved PSF (measured with gauss algorithm).
      order: 21
    - name: gauss_psf_reconvolved_t
      ucd: ''
