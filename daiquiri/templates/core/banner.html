{% load static %}
{% load i18n %}
{% load core_tags %}

<section class="wide linea-banner">
  <div id="linea-home-carousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          class="d-block w-100"
          style="height: 400px; object-fit: cover;"
          src="{% static 'daiquiri/imgs/home1.jpg' %}"
          alt="{% trans 'LIneA User Query' %}" />
        <div class="carousel-caption text-center" style="top: 50%; transform: translateY(-50%); bottom: auto;">
          <h1 style="color: #fff; font-size: 50px; font-family: 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 100; text-shadow: black 0.1em 0.1em 0.2em;">LIneA User Query</h1>
          <p class="d-none d-md-block" style="font-size: 16px;">{% trans "An interface to query LIneA's database and create user-generated tables." %}</p>
        </div>
      </div>
    </div>
  </div>
</section>
