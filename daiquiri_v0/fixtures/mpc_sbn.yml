- name: mpc_sbn
  title: Minor Planet Center (MPC) - SBN mirror
  description: 'Observations table replicated from the IAU Minor Planet Center PostgreSQL
    database via the SBN (Small Bodies Node). Contains published observations and
    those in the ITF (Initial Treatment File).

    '
  long_description: "<h3>Schema of the MPC orbits table</h3>\n\n<p>The MPC orbits\
    \ table contains orbits and orbital related information of minor planets, comets\
    \ and natural satellites. The table is continously updated everytime a new orbit\
    \ is updated.</p>\n\n<h3>Known issues</h3>\n\n<p>This table should be considered\
    \ as a work in progress, and as such at the moment does not contain all the information.\
    \ The MPC goal was to replicate the table so that the community could familiarize\
    \ with the mpc_orb.json format and provide feedback.</p>\n\n<ul>\n  <li>The table\
    \ is not fully populated. Comet and natural satellite orbits are not saved (for\
    \ now).</li>\n  <li>The fields are not fully populated.</li>\n\
    \  <li>Some orbit consistency work is needed. The table may contain orbits with\
    \ secondary designations or old orbits that have not been updated.</li>\n</ul>\n\
    \n\n<h3>Useful information</h3>\n\n<ul>\n  <li>Both packed and unpacked forms are\
    \ included in the table for the primary provisional designations.</li>\n  <li>Only\
    \ the unpacked numbered without parenthesis are included in the table for the primary\
    \ permanent designations.</li>\n  <li>The table can be linked to the current identification\
    \ table using one of the primary provisional designation fields.</li>\n</ul>\n"
  attribution: '<p>This research has made use of data and/or services provided by
    the International Astronomical Union''s <a href="https://minorplanetcenter.net/">Minor
    Planet Center</a>.</p>

    '
  order: 4
  license: ''
  published: 2026-02-04
  updated: null
  access_level: PUBLIC
  metadata_access_level: PUBLIC
  tables:
  - name: obs_sbn
    title: Observations SBN
    description: 'Replica of the MPC internal PostgreSQL observations table. Contains
      published observations and those in the ITF (Initial Treatment File).

      '
    long_description: '<p>The obs_sbn table is a replica of the MPC internal PostgreSQL
      table. It contains exactly the same information that the MPC stores internally.
      Fields are either ADES (Astrometric Data Exchange Standard) or MPC_ops (MPC
      internal operations).</p> <p>When <b>ADES</b> appears in a column description,
      the field is part of the <a href="https://github.com/IAU-ADES/ADES-Master">ADES
      standard</a>. When <b>MPC_ops</b> appears, the field is used by MPC internal
      operations.</p> <p>See the <a href="https://minorplanetcenter.net/mpcops/documentation/obs-sbn/">official
      schema</a> for known issues (duplicates, near-duplicates, invalid values) and
      usage guidance.</p>

      '
    attribution: '<p>This research has made use of data and/or services provided by
      the International Astronomical Union''s <a href="https://minorplanetcenter.net/">Minor
      Planet Center</a>.</p>

      '
    order: 1
    license: ''
    published: 2026-02-04
    updated: null
    access_level: PUBLIC
    metadata_access_level: PUBLIC
    columns:
    - name: id
      ucd: meta.id;meta.main
      unit: ''
      description: 'MPC_ops: PostgreSQL automatically generated identifier.'
      order: 1
      datatype: integer
    - name: trksub
      ucd: meta.id
      unit: ''
      description: 'ADES: Observer-assigned object identifier, unique within a submission
        batch.'
      order: 2
      datatype: clob
    - name: trkid
      ucd: meta.id
      unit: ''
      description: 'ADES: Globally unique tracklet identifier assigned by the MPC.'
      order: 3
      datatype: clob
    - name: obsid
      ucd: meta.id
      unit: ''
      description: 'ADES: Globally unique observation identifier assigned by the MPC.'
      order: 4
      datatype: clob
    - name: submission_id
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Unique MPC-assigned submission ID.'
      order: 5
      datatype: clob
    - name: submission_block_id
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Unique MPC-assigned submission block ID.'
      order: 6
      datatype: clob
    - name: obs80
      ucd: meta.record
      unit: ''
      description: 'MPC_ops: 80 or 160-character observation string.'
      order: 7
      datatype: clob
    - name: status
      ucd: meta.code
      unit: ''
      description: 'MPC_ops: Processing status. Allowed values: P = officially published
        in a circular (DOU, mid-month, monthly), p = accepted and waiting for publication
        in the next circular, I = ITF observations.'
      order: 8
      datatype: char
      arraysize: 1
    - name: ref
      ucd: meta.bib
      unit: ''
      description: 'ADES: Standard reference field used for citations.'
      order: 9
      datatype: clob
    - name: healpix
      ucd: pos.healpix
      unit: ''
      description: 'MPC_ops: Convenience value mapping (Ra,Dec) to a HEALPix patch
        (nside=32768, nested). See https://astropy-healpix.readthedocs.io/en/latest/coordinates.html
        (pixel scale ~6.4 arcsec).'
      order: 10
      datatype: bigint
    - name: permid
      ucd: meta.id
      unit: ''
      description: 'ADES: IAU permanent designation (e.g. IAU number for a numbered
        minor planet).'
      order: 11
      datatype: clob
    - name: provid
      ucd: meta.id
      unit: ''
      description: 'ADES: Unpacked MPC-assigned provisional designation (see MPC provisional
        designation definition).'
      order: 12
      datatype: clob
    - name: artsat
      ucd: meta.id
      unit: ''
      description: 'ADES: Artificial satellite identifier.'
      order: 13
      datatype: clob
    - name: mode
      ucd: meta.code
      unit: ''
      description: 'ADES: Mode of instrumentation (see MPC valid-ades-values for mode).'
      order: 14
      datatype: clob
    - name: stn
      ucd: pos.earth.obs
      unit: ''
      description: 'ADES: Observatory code assigned by the MPC for ground-based or
        space-based stations (see MPC valid-ades-values for stn).'
      order: 15
      datatype: clob
    - name: trx
      ucd: meta.code
      unit: ''
      description: 'ADES: Station codes of transmitting antenna for radar observations.'
      order: 16
      datatype: clob
    - name: rcv
      ucd: meta.code
      unit: ''
      description: 'ADES: Station codes of receiving antenna for radar observations.'
      order: 17
      datatype: clob
    - name: sys
      ucd: pos.frame
      unit: ''
      description: 'ADES: Coordinate frame for roving or space-based station coordinates
        (see MPC valid-ades-values for sys).'
      order: 18
      datatype: clob
    - name: ctr
      ucd: pos.frame
      unit: ''
      description: 'ADES: Origin of the reference system given by the coordinate frame
        (sys). Use public SPICE codes (e.g. 399=geocenter); see NAIF IDs.'
      order: 19
      datatype: integer
    - name: pos1
      ucd: pos.cartesian.x
      unit: ''
      description: 'ADES: Position of the observer (component 1). See ADES_Description.pdf.'
      order: 20
      datatype: double
    - name: pos2
      ucd: pos.cartesian.y
      unit: ''
      description: 'ADES: Position of the observer (component 2). See ADES_Description.pdf.'
      order: 21
      datatype: double
    - name: pos3
      ucd: pos.cartesian.z
      unit: ''
      description: 'ADES: Position of the observer (component 3). See ADES_Description.pdf.'
      order: 22
      datatype: double
    - name: poscov11
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (1,1) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 23
      datatype: double
    - name: poscov12
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (1,2) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 24
      datatype: double
    - name: poscov13
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (1,3) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 25
      datatype: double
    - name: poscov22
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (2,2) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 26
      datatype: double
    - name: poscov23
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (2,3) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 27
      datatype: double
    - name: poscov33
      ucd: stat.covariance
      unit: ''
      description: 'ADES: Element (3,3) of the upper triangular part of the covariance
        matrix for the observer position (same units as position coordinates). Missing
        fields are presumed zero.'
      order: 28
      datatype: double
    - name: prog
      ucd: meta.code
      unit: ''
      description: 'ADES: Program code assigned by the MPC.'
      order: 29
      datatype: clob
    - name: obstime
      ucd: time.epoch
      unit: ''
      description: 'ADES: UTC date and time of the observation.'
      order: 30
      datatype: timestamp
    - name: ra
      ucd: pos.eq.ra;meta.main
      unit: deg
      description: 'ADES: Right Ascension in decimal degrees in J2000.0 reference
        frame.'
      order: 31
      datatype: double
    - name: dec
      ucd: pos.eq.dec;meta.main
      unit: deg
      description: 'ADES: Declination in decimal degrees in J2000.0 reference frame.'
      order: 32
      datatype: double
    - name: rastar
      ucd: pos.eq.ra
      unit: deg
      description: 'ADES: For occultation, only when stn=244, Right Ascension in J2000.0
        in decimal degrees of the occulted star.'
      order: 33
      datatype: double
    - name: decstar
      ucd: pos.eq.dec
      unit: deg
      description: 'ADES: For occultation, only when stn=244, Declination in J2000.0
        in decimal degrees of the occulted star.'
      order: 34
      datatype: double
    - name: obscenter
      ucd: meta.id
      unit: ''
      description: 'ADES: Origin of offset observations (full name of a planet or
        permID or provID for a small body).'
      order: 35
      datatype: clob
    - name: deltara
      ucd: pos.eq.ra;arith.diff
      unit: arcsec
      description: 'ADES: Measured DeltaRA*cos(Dec) in arcsec in J2000.0 for offset
        measurements of a satellite wrt obsCenter, or for occultation observations
        wrt the star (stn=244).'
      order: 36
      datatype: double
    - name: deltadec
      ucd: pos.eq.dec;arith.diff
      unit: arcsec
      description: 'ADES: Measured DeltaDec in arcsec in J2000.0 for offset measurements
        of a satellite wrt obsCenter, or for occultation wrt the star (only if stn=244).'
      order: 37
      datatype: double
    - name: dist
      ucd: pos.angDistance
      unit: arcsec
      description: 'ADES: Measured distance in arcsec in J2000.0 for offset measurements
        of a satellite wrt obsCenter, or for occultation wrt the star (only if stn=244).'
      order: 38
      datatype: double
    - name: pa
      ucd: pos.posAng
      unit: deg
      description: 'ADES: Measured Position Angle in degrees in J2000.0 for offset
        measurements of a satellite wrt obsCenter, or for occultation wrt the star
        (only if stn=244).'
      order: 39
      datatype: double
    - name: rmsra
      ucd: stat.error;pos.eq.ra
      unit: arcsec
      description: 'ADES: Random component of the RA*cos(Dec) uncertainty in arcsec
        as estimated by the observer.'
      order: 40
      datatype: double
    - name: rmsdec
      ucd: stat.error;pos.eq.dec
      unit: arcsec
      description: 'ADES: Random component of the Dec uncertainty in arcsec as estimated
        by the observer.'
      order: 41
      datatype: double
    - name: rmsdist
      ucd: stat.error;pos.angDistance
      unit: arcsec
      description: 'ADES: Random component of the distance uncertainty in arcsec as
        estimated by the observer.'
      order: 42
      datatype: double
    - name: rmspa
      ucd: stat.error;pos.posAng
      unit: arcsec
      description: 'ADES: Random component of the position angle uncertainty in arcsec
        as estimated by the observer.'
      order: 43
      datatype: double
    - name: rmscorr
      ucd: stat.correlation;pos.eq
      unit: ''
      description: 'ADES: Correlation between RA and Dec or between distance and position
        angle. Derived from covariance: off-diagonal = rmsCorr x rmsRA x rmsDec (for
        RA/Dec), or rmsCorr x rmsdist x rmspa (for dist/pa).'
      order: 44
      datatype: double
    - name: delay
      ucd: time.duration
      unit: s
      description: 'ADES: Observed radar time delay in seconds.'
      order: 45
      datatype: double
    - name: rmsdelay
      ucd: stat.error;time.duration
      unit: µs
      description: 'ADES: Delay uncertainty in microseconds.'
      order: 46
      datatype: double
    - name: doppler
      ucd: em.freq
      unit: Hz
      description: 'ADES: Observed radar Doppler shift in Hz.'
      order: 47
      datatype: double
    - name: rmsdoppler
      ucd: stat.error;em.freq
      unit: Hz
      description: 'ADES: Doppler shift uncertainty in Hz.'
      order: 48
      datatype: double
    - name: astcat
      ucd: meta.catalog
      unit: ''
      description: 'ADES: Star catalog used for astrometric reduction or, for occultation,
        for the occulted star (see MPC valid-ades-values for astCat).'
      order: 49
      datatype: clob
    - name: mag
      ucd: phot.mag;meta.main
      unit: mag
      description: 'ADES: Apparent magnitude in specified band.'
      order: 50
      datatype: double
    - name: rmsmag
      ucd: stat.error;phot.mag
      unit: mag
      description: 'ADES: Apparent magnitude uncertainty in magnitudes.'
      order: 51
      datatype: double
    - name: band
      ucd: phot.band
      unit: ''
      description: 'ADES: Passband designation for photometry (see MPC valid-ades-values
        for band).'
      order: 52
      datatype: clob
    - name: photcat
      ucd: meta.catalog
      unit: ''
      description: 'ADES: Star catalog used for the photometric reduction (see MPC
        valid-ades-values for astCat).'
      order: 53
      datatype: clob
    - name: photap
      ucd: phys.angSize
      unit: arcsec
      description: 'ADES: Photometric aperture radius in arcsec.'
      order: 54
      datatype: double
    - name: nucmag
      ucd: meta.code
      unit: ''
      description: 'ADES: Nuclear magnitude flag for comets (primarily archival).
        1=True for archival cometary nuclear magnitude, 0=False. photap used in new
        standard.'
      order: 55
      datatype: smallint
    - name: logsnr
      ucd: stat.snr;phot
      unit: ''
      description: 'ADES: The log10 of the signal-to-noise ratio of the source in
        the image integrated on the entire aperture used for astrometric centroid.'
      order: 56
      datatype: double
    - name: seeing
      ucd: instr.obsty.seeing
      unit: arcsec
      description: 'ADES: Size of seeing disc in arcsec, measured at Full-Width Half-Max
        of the target point spread function.'
      order: 57
      datatype: double
    - name: exp
      ucd: time.duration
      unit: s
      description: 'ADES: Exposure time in seconds.'
      order: 58
      datatype: double
    - name: rmsfit
      ucd: stat.rms;pos.eq
      unit: arcsec
      description: 'ADES: RMS of fit of astrometric comparison stars in arcsec.'
      order: 59
      datatype: double
    - name: com
      ucd: meta.code
      unit: ''
      description: 'ADES: Flag that observation is reduced to center of mass. 1=True,
        0=False (measurement to peak power position).'
      order: 60
      datatype: smallint
    - name: frq
      ucd: em.freq
      unit: MHz
      description: 'ADES: Carrier reference frequency in MHz.'
      order: 61
      datatype: double
    - name: disc
      ucd: meta.code
      unit: ''
      description: 'ADES: Discovery flag (see MPC documentation).'
      order: 62
      datatype: char
      arraysize: 1
    - name: subfrm
      ucd: pos.frame
      unit: ''
      description: 'ADES: Originally reported reference frame for angular measurements.
        subfrm does not reflect the ADES frame (always J2000.0). E.g. B1950.0 = letter
        A in column 14 of 80-column format.'
      order: 63
      datatype: clob
    - name: subfmt
      ucd: meta.code
      unit: ''
      description: 'ADES: Format in which the observation was originally submitted
        to the MPC, filled by MPC (see MPC valid-ades-values for subfmt).'
      order: 64
      datatype: clob
    - name: prectime
      ucd: time.resolution
      unit: 1e-6 day
      description: 'ADES: Precision in millionths of a day of the reported observation
        time for archival MPC1992 observations and earlier data.'
      order: 65
      datatype: integer
    - name: precra
      ucd: stat.error;pos.eq.ra
      unit: s
      description: 'ADES: Precision for archival MPC1992 or earlier data in seconds
        for RA.'
      order: 66
      datatype: double
    - name: precdec
      ucd: stat.error;pos.eq.dec
      unit: arcsec
      description: 'ADES: Precision for archival MPC1992 or earlier data in arcsec
        for Dec.'
      order: 67
      datatype: double
    - name: unctime
      ucd: stat.error.sys;time.epoch
      unit: s
      description: 'ADES: Estimated systematic time error in seconds (presumed level
        of systematic clock error).'
      order: 68
      datatype: double
    - name: notes
      ucd: meta.note
      unit: ''
      description: 'ADES: One-character note flags for observing circumstances (see
        MPC valid-ades-values for notes).'
      order: 69
      datatype: clob
    - name: remarks
      ucd: meta.note
      unit: ''
      description: 'ADES: A comment provided by the observer.'
      order: 70
      datatype: clob
    - name: deprecated
      ucd: meta.code
      unit: ''
      description: 'ADES: Deprecated observation preserved for history. Do not use
        in orbit fitting. Only allowed value is X.'
      order: 71
      datatype: char
      arraysize: 1
    - name: localuse
      ucd: meta.note
      unit: ''
      description: 'ADES: Container for subelements carrying ancillary information
        not in the standard.'
      order: 72
      datatype: clob
    - name: nstars
      ucd: meta.number
      unit: ''
      description: 'ADES: Number of stars in the astrometric fit.'
      order: 73
      datatype: integer
    - name: prev_desig
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Previous designation for a redesignated observation (see
        obs_alteration_redesignations table).'
      order: 74
      datatype: clob
    - name: prev_ref
      ucd: meta.bib
      unit: ''
      description: 'MPC_ops: Previous publication references.'
      order: 75
      datatype: clob
    - name: rmstime
      ucd: stat.error;time.epoch
      unit: ''
      description: 'ADES: Random uncertainty in time as estimated by the observer.'
      order: 76
      datatype: double
    - name: created_at
      ucd: time.creation
      unit: ''
      description: 'MPC_ops: Date and time of initial row insert.'
      order: 77
      datatype: timestamp
    - name: updated_at
      ucd: time.modification
      unit: ''
      description: 'MPC_ops: Date and time of latest row update.'
      order: 78
      datatype: timestamp
    - name: trkmpc
      ucd: meta.id
      unit: ''
      description: 'ADES: MPC-internal object identifier.'
      order: 79
      datatype: clob
    - name: orbit_id
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Unique identifier for the orbit calculation. This field
        is not currently used.'
      order: 80
      datatype: clob
    - name: designation_asterisk
      ucd: meta.code
      unit: ''
      description: 'MPC_ops: Equivalent of asterisks marking initial tracklets for
        component provisional designations. One object can have multiple discovery_asterisks.'
      order: 81
      datatype: boolean
    - name: all_pub_ref
      ucd: meta.bib
      unit: ''
      description: 'MPC_ops: Array of publication references that contained any information
        about the observation.'
      order: 82
      datatype: clob
    - name: shapeocc
      ucd: meta.code
      unit: ''
      description: 'ADES: For occultation, flag that reduction assumes shape-based
        plane-of-sky cross-section. 1=True, 0=False (circular cross section assumed).'
      order: 83
      datatype: boolean
    - name: obssubid
      ucd: meta.id
      unit: ''
      description: 'ADES: Observation identifier, optionally included by the observer
        in the submission, unique to a given observing program.'
      order: 84
      datatype: clob
    - name: replacesobsid
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Observation identifier of the old published observation
        replaced by this one. This field is not currently used.'
      order: 85
      datatype: clob
    - name: group_id
      ucd: meta.id
      unit: ''
      description: 'MPC_ops: Observation group identifier for grouping duplicate/near-duplicate
        observations. This field is not currently used.'
      order: 86
      datatype: clob
    - name: vel1
      ucd: phys.veloc;pos.cartesian.x
      unit: ''
      description: Observer velocity component (MPC schema; no formal description
        in current documentation).
      order: 87
      datatype: double
    - name: vel2
      ucd: phys.veloc;pos.cartesian.y
      unit: ''
      description: Observer velocity component (MPC schema; no formal description
        in current documentation).
      order: 88
      datatype: double
    - name: vel3
      ucd: phys.veloc;pos.cartesian.z
      unit: ''
      description: Observer velocity component (MPC schema; no formal description
        in current documentation).
      order: 89
      datatype: double
    - name: fltr
      ucd: meta.code
      unit: ''
      description: Filter or related code (MPC schema; no formal description in current
        documentation).
      order: 90
      datatype: char
      arraysize: 3
    - name: obstime_text
      ucd: time.epoch
      unit: ''
      description: Observation time as text (MPC schema; no formal description in
        current documentation).
      order: 91
      datatype: clob
  - name: mpc_orbits
    title: MPC Orbits
    description: 'Table containing orbits and related information for any minor planet
      that has been designated and for which it is possible to fit an orbit with the
      available observations. Partially populated.'
    long_description: '<p>The <strong>mpc_orbits</strong> table contains orbits and
      orbital related information of minor planets, comets and natural satellites.
      The table is continuously updated every time a new orbit is updated.</p> <h3>Known
      issues</h3> <p>This table should be considered as a work in progress, and as
      such at the moment does not contain all the information. The MPC goal was to
      replicate the table so that the community could familiarize with the <a href="https://github.com/Smithsonian/mpc-public/">mpc_orb.json
      format</a> and provide feedback.</p> <ul> <li>The table is not fully populated.
      Comet and natural satellite orbits are not saved (for now).</li> <li>The fields
      are not fully populated.</li> <li>Some orbit consistency
      work is needed. The table may contain orbits with secondary designations or old
      orbits that have not been updated.</li> </ul> <h3>Useful information</h3> <ul>
      <li>Both packed and unpacked forms are included in the table for the primary
      provisional designations.</li> <li>Only the unpacked numbered without parenthesis
      are included in the table for the primary permanent designations.</li> <li>The
      table can be linked to the current identification table using one of the primary
      provisional designation fields.</li> </ul> <p>Schema and field descriptions follow
      the <a href="https://minorplanetcenter.net/mpcops/documentation/mpc-orbits/">MPC
      mpc_orbits documentation</a>.</p>

      '
    attribution: '<p>This research has made use of data and/or services provided by
      the International Astronomical Union''s <a href="https://minorplanetcenter.net/">Minor
      Planet Center</a>.</p>

      '
    order: 2
    license: ''
    published: 2026-02-04
    updated: null
    access_level: PUBLIC
    metadata_access_level: PUBLIC
    columns:
    - name: id
      ucd: meta.id;meta.main
      unit: ''
      description: 'PostgreSQL automatically generated identifier.'
      order: 1
      datatype: integer
    - name: packed_primary_provisional_designation
      ucd: meta.id
      unit: ''
      description: 'Packed form of the primary provisional designation (e.g. K17P08M).'
      order: 2
      datatype: clob
    - name: unpacked_primary_provisional_designation
      ucd: meta.id
      unit: ''
      description: 'Unpacked form of the primary provisional designation (e.g. 2017PM8).'
      order: 3
      datatype: clob
    - name: mpc_orb_jsonb
      ucd: meta.note
      unit: ''
