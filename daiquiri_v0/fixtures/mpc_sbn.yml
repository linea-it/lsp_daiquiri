      unit: ''
      description: If the object is in the standard_minor_planet table, this boolean
        indicates whether the orbit at the mid-observation epoch is populated.
      order: 7
      datatype: double
    - name: nongravs
      ucd: meta.code
      unit: ''
      description: 'Boolean to indicate whether the orbit of the object is specified
        in the table containing orbits with nongravitational perturbations. At the
        moment this is not used because we do not have a table for the orbits computed
        including nongravitational perturbations, even though we compute them. We might
        use this flag in the future to indicate whether we computed the orbit of the
        object using non-gravitational perturbations.'
      order: 8
      datatype: clob
    - name: satellite
      ucd: meta.code
      unit: ''
      description: Boolean to indicate whether the object-orbit is specified in the
        satellite table.
      order: 9
      datatype: boolean
    - name: comet
      ucd: meta.code
      unit: ''
      description: Boolean to indicate whether the object-orbit is specified in the
        comet table. The values are currently false because we are not saving comet
        orbits in a comet table.
      order: 10
      datatype: boolean
    - name: barycentric
      ucd: meta.code
      unit: ''
      description: Boolean to indicate whether the orbit for the object is in a barycentric
        table. The values for this field are always false because we are not computing
        barycentric orbits.
      order: 11
      datatype: boolean
    - name: no_orbit
      ucd: meta.code
      unit: ''
      description: Flag to indicate those cases for which it was not possible to compute
        an orbit.
      order: 12
      datatype: boolean
    - name: orbit_publication_references
      ucd: meta.bib
      unit: ''
      description: Array of references to MPC publication(s) containing this particular
        orbit calculation (e.g. DOU MPEC, mid-month, Monthly-MPC, etc).
      order: 13
      datatype: clob
    - name: flag_all_object_obs_consistent
      ucd: meta.code
      unit: ''
      description: Flag to indicate if all observations for an object have been checked
        to be consistent with obs files. We are not currently using this field.
      order: 14
      datatype: boolean
    - name: flag_orbit_calculated_from_consistent_obs
      ucd: meta.code
      unit: ''
      description: Flag to indicate if the orbit was calculated using the observations
        flagged as consistent. This flag is not used.
      order: 15
      datatype: boolean
    - name: flag_allowed_external
      ucd: meta.code
      unit: ''
      description: Flag to indicate if the orbit has been computed using all the
        observations available and if the observations were consistent with the flat
        files. This flag is not used.
      order: 16
      datatype: boolean
    - name: created_at
      ucd: time.creation
      unit: ''
      description: Date and time of initial row insert.
      order: 17
      datatype: timestamp
    - name: updated_at
      ucd: time.modification
      unit: ''
      description: Date and time of latest row update.
      order: 18
      datatype: timestamp
    - name: orbit_published
      ucd: meta.code
      unit: ''
      description: 'Flag indicating if the orbit has been published in a Circular.
        Field values are: 0=unpublished ; 1=published as MPEC; 2=published in DOU
        ; 3=published in mid-month ; 4=published in monthly. Please note that we
        are talking about orbit publication and not object designations.'
      order: 19
      datatype: boolean
    - name: object_type
      ucd: meta.code
      unit: ''
      description: 'Integer to indicate the object type as defined in: https://minorplanetcenter.net/mpcops/documentation/object-types/'
      order: 20
      datatype: integer
