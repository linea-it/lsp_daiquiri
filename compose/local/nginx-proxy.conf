upstream daiquiri_service {
    server backend:8000;
}

server {
    listen 80;

    charset utf-8;

    # Increase max upload size
    client_max_body_size 400M;

    # Logs
    error_log /var/log/nginx/nginx-error.log warn;
    # access_log /var/log/nginx/nginx-access.log  main;

    gzip on;
    gzip_comp_level  9;
    gzip_min_length 128;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json  application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    fastcgi_send_timeout 120s;
    fastcgi_read_timeout 120s;
    proxy_connect_timeout 120;
    send_timeout 120;

    # Daiquiri
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://daiquiri_service;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;     
    }

    # Daiquiri Admin
    location /admin {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://daiquiri_service;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;   
    }

    # Django SAML
    location /saml2 {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;

        proxy_pass http://daiquiri_service;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;        
    }

    # Estáticos (substitui --static-map do uWSGI quando o app roda com Gunicorn)
    location /daiquiri_static/ {
        alias /static_root/;
        access_log off;
        # expires 7d;
        add_header Cache-Control "public";
    }

    # Daiquiri Download
    # NAO ALTERAR: esta rota está relacionada as settings do SENDFILE no app django.
    # https://www.nginx.com/resources/wiki/start/topics/examples/xsendfile/
    location /download {
        internal;
        root   /data/;
    }

    # Celery Flower
    location /flower {
        proxy_pass http://celery_flower:5555;
    }

    # Rabbitmq Management
    location /rabbitmq/ {
        proxy_pass http://rabbit:15672/;
        rewrite ^/rabbitmq/(.*)$ /$1 break;
    }

}
