x-app-base: &app-base
  image: linea/lsp_daiquiri:${IMAGE_TAG:-latest}
  user: "1000:10006"
  env_file:
    - .env
  volumes:
    # Local Vars
    - ./local_settings.py:/app/config/settings/local.py:ro
    # Estáticos do collectstatic (Nginx serve /daiquiri_static/ a partir daqui)
    - ./data/static_root:/app/static_root:rw
    # Diretório de logs
    - ./logs:/var/log/daiquiri
    - ./logs:/var/log/celery
    # Diretórios onde o backend pode manipular arquivos.
    - ./data/files:/data/files
    - ./data/download:/data/download
    - ./data/upload:/data/upload
    # Django SAML
    - ./certificates:/app/certificates

x-celery-worker: &celery-worker
  <<: *app-base
  #restart: unless-stopped
  depends_on:
    - backend

services:
  backend: &daiquiri
    <<: *app-base
    command: /start.sh
    depends_on:
      rabbit:
        condition: service_healthy

  celery_default:
    <<: *celery-worker
    command: celery -A config worker -Q default -c "4" -l INFO --logfile=/var/log/celery/app_default.log

  celery_download: &daiquiri_celery_download
    <<: *celery-worker
    command: celery -A config worker -Q download -c "2" -l INFO --logfile=/var/log/celery/app_download.log

  celery_query_default: &daiquiri_celery_default
    <<: *celery-worker
    command: celery -A config worker -Q query_default -c "4" -l INFO --logfile=/var/log/celery/app_query_default.log

  celery_query_five_minutes: &daiquiri_celery_five_minutes
    <<: *celery-worker
    command: celery -A config worker -Q query_five_minutes -c "2" -l INFO --logfile=/var/log/celery/app_query_five_minutes.log

  celery_query_two_hours: &daiquiri_celery_two_hours
    <<: *celery-worker
    command: celery -A config worker -Q query_two_hours -c "4" -l INFO --logfile=/var/log/celery/app_query_two_hours.log

  celery_flower: &daiquiri_celery_flower
    <<: *celery-worker
    command: celery -A config flower --url-prefix=flower

  rabbit:
    image: rabbitmq:3.13-management
    env_file:
      - .env
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  # Servidor Web NGINX
  nginx:
    image: nginx:1.21.6-alpine
    ports:
      - 8002:80
    volumes:
      # Arquivo de configuração do Ngnix para este ambiente.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/static_root:/static_root:ro
      # Diretório onde o backend manipula arquivos, e que deve ficar acessivel ao servidor web.
      - ./data/download:/data/download
      # Diretório de logs do servidor web.
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - celery_flower
      - rabbit
